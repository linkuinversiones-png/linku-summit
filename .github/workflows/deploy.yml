# Publicación automática a Cloudflare Workers.
#
# Cada push a `main` (o "Run workflow" a mano) aplica las migraciones de
# Supabase pendientes, compila el sitio y lo publica. Es el equivalente de
# los pasos 1 a 5 del pipeline manual de docs/DEPLOY.md.
#
# Qué hace con las migraciones:
#   - Antes de compilar, corre `node scripts/run-migrations.mjs`, que aplica
#     solo los .sql de supabase/migrations/ que todavía no estén marcados en
#     la tabla public._applied_migrations (es idempotente). Si falla una
#     migración, el job se detiene ahí: no se compila ni se publica, y
#     producción sigue con la versión anterior.
#   - Ya no hace falta correrlas a mano antes del push (ver docs/DEPLOY.md);
#     `node scripts/run-migrations.mjs` local sigue existiendo como plan B.
#
# Lo que NO hace, a propósito:
#   - Secretos del Worker (Wompi, Resend, InContacto…): viven en Cloudflare, no aquí.
#
# Variables y secretos que necesita (Settings → Secrets and variables → Actions):
#   secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, NEXT_PUBLIC_SUPABASE_ANON_KEY,
#              SUPABASE_ACCESS_TOKEN
#   variables: NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET, NEXT_PUBLIC_SITE_URL,
#              SUPABASE_PROJECT_REF

name: Publicar en Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nunca dos publicaciones a la vez. Si llegan dos pushes seguidos, el segundo
# espera a que termine el primero (no lo cancela: un deploy a medias es peor).
concurrency:
  group: publicar-produccion
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE_URL: https://www.linkusummit.com

jobs:
  publicar:
    name: Compilar y publicar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Aplicar migraciones de Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::Faltan SUPABASE_ACCESS_TOKEN (secret) y/o SUPABASE_PROJECT_REF (variable) en GitHub. Configúralos en Settings → Secrets and variables → Actions (SUPABASE_ACCESS_TOKEN como secret, SUPABASE_PROJECT_REF como variable) y vuelve a correr el workflow."
            exit 1
          fi
          node scripts/run-migrations.mjs

      - name: Compilar (Next + OpenNext para Cloudflare)
        # Next.js incrusta las NEXT_PUBLIC_* en el build. Por eso van aquí y por
        # eso NEXT_PUBLIC_SITE_URL es la de producción, nunca localhost.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail
          for v in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET NEXT_PUBLIC_SITE_URL; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Falta la variable/secreto $v en GitHub (Settings → Secrets and variables → Actions)."
              exit 1
            fi
          done
          case "$NEXT_PUBLIC_SITE_URL" in
            *localhost*) echo "::error::NEXT_PUBLIC_SITE_URL apunta a localhost; debe ser $SITE_URL"; exit 1 ;;
          esac
          npx opennextjs-cloudflare build

      - name: Publicar en Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Faltan CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID en los secrets del repo."
            exit 1
          fi
          npx wrangler deploy .open-next/worker.js --name linku-summit

      - name: Verificar que el sitio responde con la versión nueva
        shell: bash
        run: |
          set -euo pipefail
          ESPERADO="$(cat .open-next/assets/BUILD_ID)"
          echo "BUILD_ID esperado: $ESPERADO"
          for intento in 1 2 3 4 5 6; do
            CODIGO="$(curl -s -m 30 -o /dev/null -w '%{http_code}' "$SITE_URL/" || echo 000)"
            PUBLICADO="$(curl -s -m 30 "$SITE_URL/BUILD_ID" || echo '')"
            echo "intento $intento: portada $CODIGO, BUILD_ID publicado ${PUBLICADO:-?}"
            if [ "$CODIGO" = "200" ] && [ "$PUBLICADO" = "$ESPERADO" ]; then
              {
                echo "## ✅ Publicado"
                echo ""
                echo "- Sitio: $SITE_URL"
                echo "- BUILD_ID: \`$ESPERADO\`"
                echo "- Commit: \`${{ github.sha }}\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::El sitio no respondió 200 con la versión nueva tras 6 intentos. Revisa el Worker en Cloudflare y considera 'npx wrangler rollback'."
          exit 1
